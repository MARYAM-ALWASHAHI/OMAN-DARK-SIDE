; Android quality presets (Low / Mid / High) layered on top of the engine's own Android_* profiles.
; The engine picks the profile from its GPU/RAM matching rules; testers can force one with the
;   console variable: dp.Override Android_Low   (or Android_Mid / Android_High)
; Targets: Low and Mid locked at 30 FPS, High at 60 FPS (optional). No Lumen/Nanite on any profile.

[Android_Low DeviceProfile]
+CVars=sg.ViewDistanceQuality=0
+CVars=sg.ShadowQuality=0
+CVars=sg.TextureQuality=0
+CVars=sg.EffectsQuality=0
+CVars=sg.PostProcessQuality=0
+CVars=sg.FoliageQuality=0
+CVars=r.MSAACount=1
+CVars=r.Shadow.CSM.MaxMobileCascades=1
+CVars=r.Shadow.MaxResolution=512
+CVars=t.MaxFPS=30

[Android_Mid DeviceProfile]
+CVars=sg.ViewDistanceQuality=1
+CVars=sg.ShadowQuality=1
+CVars=sg.TextureQuality=1
+CVars=sg.EffectsQuality=1
+CVars=sg.PostProcessQuality=1
+CVars=sg.FoliageQuality=1
+CVars=r.MSAACount=2
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxResolution=1024
+CVars=t.MaxFPS=30

[Android_High DeviceProfile]
+CVars=sg.ViewDistanceQuality=2
+CVars=sg.ShadowQuality=2
+CVars=sg.TextureQuality=2
+CVars=sg.EffectsQuality=2
+CVars=sg.PostProcessQuality=2
+CVars=sg.FoliageQuality=2
+CVars=r.MSAACount=4
+CVars=r.Shadow.CSM.MaxMobileCascades=2
+CVars=r.Shadow.MaxResolution=2048
+CVars=t.MaxFPS=60
