[/Script/EngineSettings.GameMapsSettings]
; Milestone 1: any level you create uses the OTD game mode unless overridden in World Settings.
GlobalDefaultGameMode=/Script/OmanDarkSide.OTDGameMode
; Greybox milestone map. It is created by Content/Python/otd_build_greybox.py (run once in the editor).
; Until that script has been run the engine logs a missing-map warning and opens an empty level.
GameDefaultMap=/Game/OTD/Maps/L_WadiAlSukoon_Mobile.L_WadiAlSukoon_Mobile
EditorStartupMap=/Game/OTD/Maps/L_WadiAlSukoon_Mobile.L_WadiAlSukoon_Mobile

[/Script/HardwareTargeting.HardwareTargetingSettings]
; Mobile-only project. "Maximum" keeps the higher-quality mobile features enabled (high-end devices).
TargetedHardwareClass=Mobile
AppliedTargetedHardwareClass=Mobile
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.RendererSettings]
; Mobile renderer for broad Android support (milestone: mobile greybox).
; Forward shading (ShadingPath=0) runs on far more Android GPUs than mobile deferred, and allows MSAA.
r.Mobile.ShadingPath=0
r.MobileHDR=True
; 3 = MSAA on the mobile forward renderer. Sample count is set per device profile (DefaultDeviceProfiles.ini).
r.Mobile.AntiAliasing=3
r.MSAACount=4
r.Mobile.AmbientOcclusion=False
r.AllowStaticLighting=True
; Explicitly OFF for this project: no Lumen, no Nanite, no virtual shadow maps, no distance fields.
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.GenerateMeshDistanceFields=False

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Development machine only (the editor runs on Windows). Not a release target.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12

; ---------------- Mobile (phone + iPad) ----------------
; PLACEHOLDER package/bundle IDs: change to your own before publishing.

